name: 🐧 Linux Builds
on:
  push:
    branches: [ ci ]
  pull_request:
    branches: [ ci ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global Cache Settings
env:
  SCONS_CACHE_LIMIT_GB: 4

jobs:
  linux:
    runs-on: "ubuntu-22.04"
    name: ${{matrix.name}}

    strategy:
      matrix:
        include:
          - name: 4.6.2-stable Template
            precision: double
            target: template_release
            production: yes
            executable_name: godot.linuxbsd.template_release.double.x86_64
            godot_base_branch: "4.6.2-stable"
            warnings: extra
            werror: yes

          - name: 4.6.2-stable Editor Float64
            precision: double
            target: editor
            production: yes
            executable_name: godot.linuxbsd.editor.double.x86_64
            godot_base_branch: "4.6.2-stable"
            warnings: extra
            werror: yes

    steps:
      # Clone Godot
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ matrix.godot_base_branch }}

      # Clone our module under the correct directory
      - uses: actions/checkout@v4
        with:
          path: modules/voxel

      # Setup custom buildroot so we may use an old but compatible GLIBC version, while keeping recent toolchain.
      # This allows to make production builds that are compatible with older Linux distros.
      - name: Cache buildroot
        id: cache-buildroot
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/x86_64-godot-linux-gnu_sdk-buildroot
          key: buildroot-godot-2023.08.x-4

      - name: Setup buildroot
        if: steps.cache-buildroot.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          tar -xjf x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          cd x86_64-godot-linux-gnu_sdk-buildroot
          ./relocate-sdk.sh
          cd ..
          rm x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2

      - name: Configure PATH for buildroot
        run: echo "${GITHUB_WORKSPACE}/x86_64-godot-linux-gnu_sdk-buildroot/bin" >> $GITHUB_PATH

      - name: Install wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin

      # [Already provided by the custom buildroot]
      # Azure repositories are not reliable, we need to prevent azure giving us packages.
      # - name: Make apt sources.list use the default Ubuntu repositories
      #   run: |
      #     sudo rm -f /etc/apt/sources.list.d/*
      #     sudo cp -f misc/ci/sources.list /etc/apt/sources.list
      #     sudo apt-get update

      # [Already provided by the custom buildroot]
      # Install all packages (except scons)
      # - name: Configure dependencies
      #   run: |
      #     sudo apt-get install build-essential pkg-config libx11-dev libxcursor-dev \
      #       libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev yasm

      # Upload cache on completion and check it out now
      - name: Load .scons_cache directory
        id: linux-cache
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.scons_cache/
          key: ${{matrix.executable_name}}-${{matrix.godot_base_branch}}-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ${{matrix.executable_name}}-${{matrix.godot_base_branch}}-${{github.ref}}-${{github.sha}}
            ${{matrix.executable_name}}-${{matrix.godot_base_branch}}-${{github.ref}}
            ${{matrix.executable_name}}-${{matrix.godot_base_branch}}

      # [Already provided by the custom buildroot]
      # Use python 3.x release (works cross platform; best to keep self contained in it's own step)
      # - name: Set up Python 3.x
      #   uses: actions/setup-python@v5
      #   with:
      #     # Semantic version range syntax or exact version of a Python version
      #     python-version: '3.x'
      #     # Optional - x64 or x86 architecture, defaults to x64
      #     architecture: 'x64'

      # [Already provided by the custom buildroot]
      # Setup scons, print python version and scons version info, so if anything is broken it won't run the build.
      # - name: Configuring Python packages
      #   run: |
      #     python -c "import sys; print(sys.version)"
      #     python -m pip install scons
      #     python --version
      #     scons --version

      # We should always be explicit with our flags usage here since it's gonna be sure to always set those flags
      - name: Compilation
        env:
          # `SCONS_CACHE` and `SCONS_CACHE_LIMIT` became deprecated since 
          # https://github.com/godotengine/godot/commit/0e4a4e3c4d602691ce1b4fc6a721c5c637ead57f
          # However since we are also building versions preceding that change, 
          # we have to keep them in addition to the new parameters
          SCONS_CACHE: ${{github.workspace}}/.scons_cache/
          # The new way uses a different unit.
          # I wish I could do `SCONS_CACHE_LIMIT_GB * 1024` but it isn't documented as an available operator
          SCONS_CACHE_LIMIT: 4096
        run: |
          scons verbose=yes warnings=${{matrix.warnings}} voxel_werror=${{matrix.werror}} strict_checks=yes platform=linuxbsd tests=no dev_build=no target=${{matrix.target}} production=${{matrix.production}} precision=${{matrix.precision}} "cache_path=${{github.workspace}}/.scons_cache/" cache_limit=${{env.SCONS_CACHE_LIMIT_GB}}

      # Make build available
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.production == 'yes' }}
        with:
          name: ${{matrix.executable_name}}
          path: bin/${{matrix.executable_name}}