name: 🤖 Android Builds
on:
  push:
    branches: [ ci ]
  pull_request:
    branches: [ ci ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global Cache Settings
env:
  SCONS_CACHE_LIMIT_GB: 4

jobs:
  android-template:
    runs-on: "ubuntu-22.04"
    name: Android Template Build

    strategy:
      matrix:
        arch: [arm64v8, x86_64]
        target: [template_release]
        include:
          - godot_base_branch: "4.6.1-stable"

    steps:
      # Clone Godot
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ matrix.godot_base_branch }}

      # Clone our module under the correct directory
      - uses: actions/checkout@v4
        with:
          path: modules/voxel

      # Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # Upload cache on completion and check it out now
      - name: Load .scons_cache directory
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.scons_cache/
          key: godot.android.template_release.double.${{matrix.arch}}-${{matrix.godot_base_branch}}-${{github.ref}}-${{github.sha}}
          restore-keys: |
            godot.android.template_release.double.${{matrix.arch}}-${{matrix.godot_base_branch}}-${{github.ref}}
            godot.android.template_release.double.${{matrix.arch}}-${{matrix.godot_base_branch}}

      # Use python 3.x release
      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: 'x64'

      # Setup scons
      - name: Configuring Python packages
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons
          python --version
          scons --version

      # Compilation
      - name: Compilation
        env:
          SCONS_CACHE: ${{github.workspace}}/.scons_cache/
          SCONS_CACHE_LIMIT: 4096
        run: |
          scons arch=${{matrix.arch}} verbose=yes warnings=extra werror=yes strict_checks=yes platform=android tests=no dev_build=no target=${{matrix.target}} production=yes precision=double "cache_path=${{github.workspace}}/.scons_cache/" cache_limit=${{env.SCONS_CACHE_LIMIT_GB}}

      # Make build available
      - uses: actions/upload-artifact@v4
        with:
          name: godot.android.template_release.double.${{matrix.arch}}
          path: bin/libgodot.android.template_release.double.${{matrix.arch}}.so
